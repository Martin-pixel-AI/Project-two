services:
  - type: web
    name: truespace
    env: node
    buildCommand: cd truespace && npm install && npx prisma generate && npm run build
    startCommand: cd truespace && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Render will prompt for this value on first deploy 